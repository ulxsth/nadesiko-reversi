<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>アンミカリバーシ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <script src="./vendor/wnako3.js"></script>
  </head>
  <body>
    <main class="layout">
      <h1 class="title">アンミカリバーシ</h1>

      <section class="board-shell">
        <canvas
          id="game-canvas"
          width="640"
          height="640"
          tabindex="0"
          role="application"
          aria-label="8×8のアンミカリバーシ盤。矢印キーで場所を選び、Enterまたはスペースで駒を置き、Pでパスします。"
        ></canvas>
      </section>

      <aside class="panel">
        <section class="panel-block status-block">
          <p id="status-phase" class="status-phase" role="status" aria-live="polite">読込中</p>
          <p id="status-message" class="status-message"></p>
          <div id="average-scale" class="average-scale" role="meter" aria-label="終局盤面の平均色" aria-valuemin="0" aria-valuemax="255" hidden>
            <div class="average-track">
              <span id="average-marker" class="average-marker" aria-hidden="true"></span>
            </div>
          </div>
        </section>

        <section class="panel-block">
          <div class="next-color">
            <span id="next-color-swatch" class="swatch" role="img" aria-label="次に置く駒の色"></span>
          </div>
          <dl class="meta">
            <dt>手番</dt>
            <dd id="meta-turn-player">—</dd>
            <dt id="seat-label" hidden>自分</dt>
            <dd id="seat-value" hidden>—</dd>
          </dl>
        </section>

        <section class="panel-block">
          <div class="controls">
            <button id="play-online-button" type="button" class="action">二人対戦</button>
            <button id="play-local-button" type="button" class="action" hidden>ローカル対局へ戻る</button>
            <button id="reconnect-button" type="button" class="action" hidden>再接続</button>
            <div id="local-controls">
              <div class="controls">
                <label id="seed-control" class="control" hidden>
                  <span>seed</span>
                  <input id="seed-input" type="number" min="0" max="4294967295" step="1" value="1" inputmode="numeric">
                </label>
                <button id="new-game-button" type="button" class="action">新しい対局</button>
              </div>
            </div>
            <button id="pass-button" type="button" class="action" disabled>パス</button>
            <button id="replay-open-button" type="button" class="action" hidden>対局の記録を見る</button>
          </div>
        </section>

        <section id="replay-panel" class="panel-block" hidden>
          <p id="replay-position" role="status"></p>
          <div class="controls">
            <button id="replay-back-button" type="button" class="action">前へ</button>
            <button id="replay-next-button" type="button" class="action">次へ</button>
            <button id="replay-exit-button" type="button" class="action">対局へ戻る</button>
          </div>
          <pre id="replay-source" style="max-height:16rem;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere"></pre>
        </section>

        <section class="panel-block">
          <p class="status-message" style="opacity:.75">対局と記録はサーバーの中だけに保持され、再起動で消えます。二人対戦の相手は先着順で決まります。</p>
        </section>
      </aside>
    </main>

    <section
      id="result-popup"
      class="result-popup"
      role="status"
      aria-live="assertive"
      aria-atomic="true"
      hidden
    >
      <p id="result-popup-message" class="result-popup-message"></p>
    </section>

    <textarea id="bridge-in" hidden></textarea>
    <button id="bridge-event" type="button" hidden></button>
    <span id="bridge-out" hidden></span>

    <script type="module">
      const inbound = document.querySelector('#bridge-in')
      const outbound = document.querySelector('#bridge-out')
      const eventButton = document.querySelector('#bridge-event')
      const emit = (message) => {
        inbound.value = JSON.stringify(message)
        eventButton.click()
      }
      let socket = null
      let generation = 0
      const playerIdKey = 'nadesiko-reversi-player-id'
      const playerId = sessionStorage.getItem(playerIdKey) ?? crypto.randomUUID().replaceAll('-', '')
      sessionStorage.setItem(playerIdKey, playerId)
      if (new URLSearchParams(location.search).get('debug') === '1') {
        document.querySelector('#seed-control').hidden = false
      }

      const connect = () => {
        const ownGeneration = ++generation
        socket?.close()
        const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:'
        const url = `${scheme}//${location.host}/api/match?playerId=${encodeURIComponent(playerId)}`
        socket = new WebSocket(url)
        socket.addEventListener('open', () => {
          if (ownGeneration === generation) emit({type: 'bridgeOpen'})
        })
        socket.addEventListener('message', (event) => {
          if (ownGeneration !== generation) return
          try { emit(JSON.parse(event.data)) }
          catch { emit({type: 'bridgeError', reason: '対戦の応答を読み取れません'}) }
        })
        socket.addEventListener('close', (event) => {
          // サーバーが理由つきで閉じた場合は、その理由を画面へそのまま渡す。
          if (ownGeneration === generation) emit({type: 'bridgeClosed', code: event.code, reason: event.reason})
        })
        socket.addEventListener('error', () => {
          if (ownGeneration === generation) emit({type: 'bridgeError', reason: '対戦サーバーへ接続できません'})
        })
      }
      new MutationObserver(() => {
        const message = JSON.parse(outbound.textContent || '{}')
        if (message.action === 'connect') connect()
        if (message.action === 'disconnect') {
          generation++
          socket?.close()
          socket = null
        }
        if (message.action === 'send') {
          if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message.command))
          else emit({type: 'bridgeError', reason: '対戦サーバーへ接続されていません'})
        }
      }).observe(outbound, {childList: true, characterData: true, subtree: true})
      window.addEventListener('beforeunload', () => socket?.close())

      const source = await fetch('./main.nako3').then((response) => {
        if (!response.ok) throw new Error(`main.nako3: ${response.status}`)
        return response.text()
      })

      try {
        await navigator.nako3.runAsync(source, 'main.nako3')
      } catch (error) {
        document.querySelector('#status-phase').textContent = 'エラー'
        document.querySelector('#status-message').textContent = error.message
        console.error(error)
      }
    </script>
  </body>
</html>
