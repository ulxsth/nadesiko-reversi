<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>アンミカリバーシ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <script src="./vendor/wnako3.js"></script>
  </head>
  <body>
    <main class="layout">
      <h1 class="title">アンミカリバーシ</h1>

      <section class="board-shell">
        <canvas
          id="game-canvas"
          width="640"
          height="640"
          tabindex="0"
          role="application"
          aria-label="8行8列のアンミカリバーシ盤。矢印キーでマスを選び、Enterまたはスペースで着手、Pでパスします。"
        ></canvas>
      </section>

      <aside class="panel">
        <section class="panel-block status-block">
          <p id="status-phase" class="status-phase" role="status" aria-live="polite">読込中</p>
          <p id="status-message" class="status-message"></p>
        </section>

        <section class="panel-block">
          <div class="next-color">
            <span id="next-color-swatch" class="swatch" aria-hidden="true"></span>
            <span id="next-color-value" class="next-color-value">—</span>
          </div>
          <dl class="meta">
            <dt>手番</dt>
            <dd id="meta-turn-player">—</dd>
            <dt>手数</dt>
            <dd id="meta-turn-number">—</dd>
            <dt>合法手</dt>
            <dd id="meta-legal-count">—</dd>
            <dt>自分</dt>
            <dd id="meta-self">—</dd>
          </dl>
        </section>

        <section class="panel-block">
          <div class="controls">
            <label class="control">
              <span>fixture</span>
              <select id="fixture-select">
                <option value="new-game">開始直後</option>
                <option value="early-game">序盤</option>
                <option value="mid-game">中盤</option>
                <option value="pass-required">パスのみ</option>
                <option value="finished">終了</option>
              </select>
            </label>
            <label class="control">
              <span>自分</span>
              <select id="self-select">
                <option value="dark">先手 dark</option>
                <option value="light">後手 light</option>
              </select>
            </label>
            <button id="pass-button" type="button" class="action" disabled>パス</button>
          </div>
        </section>

        <section class="panel-block">
          <h2 class="panel-title">command</h2>
          <pre id="command-preview" class="command-preview">—</pre>
        </section>
      </aside>
    </main>

    <script type="module">
      const source = await fetch('./main.nako3').then((response) => {
        if (!response.ok) throw new Error(`main.nako3: ${response.status}`)
        return response.text()
      })

      try {
        await navigator.nako3.runAsync(source, 'main.nako3')
      } catch (error) {
        document.querySelector('#status-phase').textContent = 'エラー'
        document.querySelector('#status-message').textContent = error.message
        console.error(error)
      }
    </script>
  </body>
</html>
